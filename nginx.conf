server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index feed.html;

    # Preserve the redirects implemented by the Vite development server.
    location = / {
        rewrite ^ /feed.html redirect;
    }

    location = /admin {
        rewrite ^ /admin/reports.html redirect;
    }

    location = /admin/ {
        rewrite ^ /admin/reports.html redirect;
    }

    location = /explore.html/blogs {
        rewrite ^ /explore.html redirect;
    }

    location = /explore.html/threads {
        rewrite ^ /explore.html redirect;
    }

    location = /profilePage.html/support {
        rewrite ^ /profilePage.html redirect;
    }

    location = /profilePage.html/ {
        rewrite ^ /profilePage.html redirect;
    }

    # Vite's development server displays error.html for unknown HTML pages.
    location / {
        try_files $uri $uri/ @missing_page;
    }

    location @missing_page {
        rewrite ^ /error.html redirect;
    }
}
